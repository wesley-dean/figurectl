---
name: Test

# yamllint disable-line rule:truthy
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Check, build, and test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system development tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes bats curl doxygen graphviz make shellcheck shfmt

      - name: Verify build does not acquire missing dependencies
        run: |
          test ! -e vendor
          stderr="${RUNNER_TEMP}/build.stderr"
          if make build >/dev/null 2>"${stderr}"; then
            printf '%s\n' 'make build unexpectedly succeeded without prepared dependencies' >&2
            exit 1
          fi
          grep -F 'Missing build dependency vendor/bash-minifier.bash' "${stderr}"
          test ! -e vendor

      - name: Validate maintained source
        run: make check

      - name: Synchronize and verify repository dependencies
        run: |
          make deps
          make deps-check

      - name: Verify make all from fresh generated state
        run: |
          rm -rf dist test-results doc/reference
          make all
          make deps-check

      - name: Verify build artifacts and checksums
        run: |
          mapfile -t artifacts < <(find dist -maxdepth 1 -type f -name '*.bash' -perm -u+x -print | sort)
          test "${#artifacts[@]}" -eq 3
          for artifact in "${artifacts[@]}"; do
            test -f "${artifact}.sha256"
            test ! -e "${artifact}.256"
            (cd dist && sha256sum -c "$(basename "${artifact}").sha256")
          done
          test -x dist/figurectl.dev.bash
          test -x dist/figurectl.bash
          test -x dist/figurectl.min.bash
          grep -F '# Generated by make build. Do not edit directly.' dist/figurectl.dev.bash
          grep -F '# Discovered input plugins:' dist/figurectl.dev.bash
          grep -F 'lib/plugins/input/dot.bash' dist/figurectl.dev.bash
          grep -F 'lib/plugins/input/text.bash' dist/figurectl.dev.bash
          grep -F 'lib/plugins/output/png.bash' dist/figurectl.dev.bash
          grep -F 'lib/plugins/output/svg.bash' dist/figurectl.dev.bash
          if grep -F '# Generated by make build. Do not edit directly.' dist/figurectl.bash; then
            printf '%s\n' 'ordinary artifact retained a full-line generated comment' >&2
            exit 1
          fi
          if cmp -s dist/figurectl.bash dist/figurectl.min.bash; then
            printf '%s\n' 'minified artifact is byte-identical to ordinary artifact' >&2
            exit 1
          fi

      - name: Verify deterministic build output
        run: |
          mkdir -p "${RUNNER_TEMP}/first-build"
          cp dist/*.bash "${RUNNER_TEMP}/first-build/"
          for artifact in dist/*.bash; do
            : >"${artifact}.256"
          done
          make build
          for artifact in dist/*.bash; do
            cmp "${RUNNER_TEMP}/first-build/$(basename "${artifact}")" "${artifact}"
            test -f "${artifact}.sha256"
            test ! -e "${artifact}.256"
          done

      - name: Generate documentation from prepared dependencies
        run: |
          make docs
          make deps-check
          test -f doc/reference/index.html
          test -z "$(git status --short)"

      - name: Run Bats tests for every artifact flavor
        id: bats
        continue-on-error: true
        run: make test-report

      - name: Diagnose unsafe identifier failure
        if: steps.bats.outcome == 'failure'
        run: |
          diagnostic="${RUNNER_TEMP}/unsafe-id-diagnostic"
          figures="${diagnostic}/figures"
          mkdir -p "${figures}"
          cat >"${diagnostic}/input.md" <<'EOF'
          <!-- figure id="../escape" format="text" alt="Unsafe" -->
          ```text
          unsafe
          ```
          EOF
          set +e
          dist/figurectl.dev.bash process \
            --format text \
            --figures-dir "${figures}" \
            "${diagnostic}/input.md" \
            >"${diagnostic}/stdout" \
            2>"${diagnostic}/stderr"
          status=$?
          set -e
          printf 'unsafe diagnostic status=%s\n' "${status}"
          printf '%s\n' '--- stdout ---'
          cat "${diagnostic}/stdout"
          printf '%s\n' '--- stderr ---'
          cat "${diagnostic}/stderr"
          printf '%s\n' '--- files ---'
          find "${diagnostic}" -maxdepth 2 -type f -print | sort
          printf 'escaped file exists: '
          if test -e "${diagnostic}/escape.txt"; then
            printf '%s\n' yes
          else
            printf '%s\n' no
          fi

      - name: Publish Bats test results
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: always()
        with:
          name: Bats tests
          path: test-results/*.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: true

      - name: Verify artifacts are independent of maintained and vendor state
        if: steps.bats.outcome == 'success'
        run: |
          isolated="${RUNNER_TEMP}/figurectl-isolated"
          mkdir -p "${isolated}/bin"
          cp dist/*.bash "${isolated}/bin/"
          cat >"${isolated}/input.md" <<'EOF'
          <!-- figure id="isolated" format="text" alt="Isolated execution" -->
          ```text
          standalone
          ```
          EOF
          rm -rf vendor src lib scripts
          for artifact in "${isolated}"/bin/*.bash; do
            name="$(basename "${artifact}")"
            figures="${isolated}/figures-${name}"
            output="${isolated}/output-${name}.md"
            "${artifact}" --help >/dev/null
            "${artifact}" process \
              --format text \
              --figures-dir "${figures}" \
              --output "${output}" \
              "${isolated}/input.md"
            grep -Fq -- 'standalone' "${output}"
            test -s "${figures}/isolated.txt"
          done

      - name: Fail if Bats failed
        if: steps.bats.outcome == 'failure'
        run: exit 1

  bash43:
    name: Bash 4.3 compatibility
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependency bootstrap requirements
        run: sudo apt-get update && sudo apt-get install --yes curl make

      - name: Prepare dependencies and build
        run: make all

      - name: Validate every artifact under Bash 4.3
        run: |
          for artifact in dist/*.bash; do
            docker run --rm \
              --env FIGURECTL_ARTIFACT="/work/${artifact}" \
              --volume "${GITHUB_WORKSPACE}:/work:ro" \
              --workdir /work \
              bash:4.3 \
              bash tests/compat-bash43.bash
          done
